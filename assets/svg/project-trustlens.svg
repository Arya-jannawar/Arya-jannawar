<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170">
  <title>Featured build — TrustLens</title>
  <defs>
    <clipPath id="cardClip"><rect width="840" height="170" rx="14"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="840" height="170" fill="#0b0f17"/>
    <rect x="0" y="0" width="7" height="170" fill="#bd5fff">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="-1s" repeatCount="indefinite"/>
    </rect>
    <rect width="840" height="170" rx="14" fill="none" stroke="#1c2431" stroke-width="1.2"/>
    <rect x="0.8" y="0.8" width="838.4" height="168.4" rx="13.5" fill="none" stroke="#bd5fff" stroke-opacity="0.6" stroke-width="1.6" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <g transform="skewX(-18)">
      <rect x="-260" y="-20" width="180" height="210" fill="url(#sheen)">
        <animate attributeName="x" values="-260;-260;1100;1100" keyTimes="0;0.62;0.86;1" dur="7.5s" begin="-2.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="730" y="152" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="70" fill="#ffffff" opacity="0.045">02</text>
    <text x="30" y="42" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" fill="#bd5fff">PROJECT // 02</text>
    <text x="30" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="27" fill="#f0f6fc">TrustLens</text>
    <text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#9aa7b8">An AI lens for trust — verifying claims before the internet shares them</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="12.5">
      <rect x="30" y="122" width="90" height="22" rx="11" fill="#bd5fff" fill-opacity="0.10" stroke="#bd5fff" stroke-opacity="0.4"/>
      <text x="75" y="137" text-anchor="middle" fill="#bd5fff">TypeScript</text>
      <rect x="130" y="122" width="71" height="22" rx="11" fill="#bd5fff" fill-opacity="0.10" stroke="#bd5fff" stroke-opacity="0.4"/>
      <text x="165.5" y="137" text-anchor="middle" fill="#bd5fff">Node.js</text>
      <rect x="211" y="122" width="45" height="22" rx="11" fill="#bd5fff" fill-opacity="0.10" stroke="#bd5fff" stroke-opacity="0.4"/>
      <text x="233.5" y="137" text-anchor="middle" fill="#bd5fff">NLP</text>
    </g>
    <rect x="688" y="20" width="124" height="26" rx="13" fill="#bd5fff" fill-opacity="0.12" stroke="#bd5fff" stroke-opacity="0.5"/>
    <text x="750" y="37.5" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#bd5fff">⚙ ACTIVE</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <text x="748" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#bd5fff">VIEW →</text>
    </g>
  </g>
</svg>
