      <animate attributeName="y2" values="214;324" dur="3.2s" begin="-2.74s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0.5;0.12" keyTimes="0;0.4;1" dur="3.2s" begin="-2.74s" repeatCount="indefinite"/>
