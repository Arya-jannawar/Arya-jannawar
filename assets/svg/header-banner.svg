      <animate attributeName="y2" values="214;324" dur="3.2s" begin="-1.37s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0.5;0.12" keyTimes="0;0.4;1" dur="3.2s" begin="-1.37s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="214" y2="214">
      <animate attributeName="y1" values="214;324" dur="3.2s" begin="-1.83s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="214;324" dur="3.2s" begin="-1.83s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0.5;0.12" keyTimes="0;0.4;1" dur="3.2s" begin="-1.83s" repeatCount="indefinite"/>
