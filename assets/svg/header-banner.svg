<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>Arya Jannawar — Full-Stack Developer &amp; AI Builder</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#171738"/>
      <stop offset="55%" stop-color="#0b0b20"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="52%" stop-color="#bd5fff"/>
      <stop offset="100%" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="42%" stop-color="#ff2e97"/>
      <stop offset="100%" stop-color="#5b1fb8"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="horizon"><rect x="0" y="0" width="1200" height="213"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurXL" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

