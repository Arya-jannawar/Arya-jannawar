    <circle cx="580" cy="25" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.9s" begin="-2.6s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="70" r="1.0"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="-0.3s" repeatCount="indefinite"/></circle>
