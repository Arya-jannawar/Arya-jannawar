    <circle cx="840" cy="170" r="1.0"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="-2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="55" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="130" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="40" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.4s" begin="-3.7s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="150" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.0s" begin="-2.0s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="90" r="1.7"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="180" r="1.0"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.5s" begin="-0.8s" repeatCount="indefinite"/></circle>
