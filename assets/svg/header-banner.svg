    <circle cx="330" r="2" fill="#bd5fff"><animate attributeName="cy" values="330;70" dur="9s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.12;0.7;1" dur="9s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="540" r="2" fill="#ff2e97"><animate attributeName="cy" values="330;70" dur="13s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.12;0.7;1" dur="13s" begin="-1s" repeatCount="indefinite"/></circle>
