    <path d="M1154 304 H1184 V274"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></path>
  </g>

  <!-- typography -->
  <text x="600" y="46" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" letter-spacing="3" fill="#00e5ff" opacity="0.9">// NEON.OS v2.0 — PROFILE_INIT ▍<animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/></text>
  <text x="600" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="82" letter-spacing="5" fill="url(#titleGrad)" filter="url(#glow)">ARYA JANNAWAR</text>
  <text x="600" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" letter-spacing="7" fill="#e6edf3" opacity="0.95" stroke="#05050f" stroke-width="5" paint-order="stroke">FULL-STACK DEVELOPER × AI BUILDER × CREATIVE CODER</text>
  <text x="600" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="13.5" fill="#a8b3c4" stroke="#05050f" stroke-width="4" paint-order="stroke">// status: building MetroMind — AI copilot for Pune Metro</text>
