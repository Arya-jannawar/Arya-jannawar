    <circle cx="1150" r="2" fill="#ff2e97"><animate attributeName="cy" values="330;70" dur="11s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.12;0.7;1" dur="11s" begin="-9s" repeatCount="indefinite"/></circle>
